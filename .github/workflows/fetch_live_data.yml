name: Fetch Live Sports Data

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7 AM ET — before day games
    - cron: '0 17 * * *'   # 17:00 UTC = 1 PM ET — afternoon refresh
  workflow_dispatch:         # manual trigger from GitHub Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit data files back to the repo

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch live data
        env:
          SPORTSDATA_API_KEY:   ${{ secrets.SPORTSDATA_API_KEY }}
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
          ALPACA_API_KEY:       ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY:    ${{ secrets.ALPACA_SECRET_KEY }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY }}
        run: python fetchers/live_data.py

      - name: Commit and push data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh live sports data [skip ci]"
            git push origin main
          fi
