name: NRFI Daily Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # 1 PM UTC = 9 AM ET   — morning predictions + entry odds
    - cron: '0 23 * * *'   # 11 PM UTC = 7 PM ET  — capture closing NRFI lines (CLV)
    - cron: '0 5 * * *'    # 5 AM UTC = 1 AM ET   — resolve last night's games + CLV
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'predict'
        type: choice
        options:
          - predict
          - capture-odds
          - resolve
      date:
        description: 'Date override (YYYY-MM-DD, optional)'
        required: false

jobs:
  predict:
    name: Morning Predictions (9 AM ET)
    # Run at 1 PM UTC OR manual trigger with mode=predict
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'predict')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run predictions
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY || vars.OPENWEATHER_API_KEY }}
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/daily_nrfi.py $DATE_ARG

      - name: Commit report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nrfi_predictions/ data/nrfi_reports/
          if git diff --staged --quiet; then
            echo "No predictions to commit."
          else
            git commit -m "nrfi: daily predictions $(date -u +%Y-%m-%d) [skip ci]"
            git push origin main
          fi

  capture-odds:
    name: Capture Closing NRFI Lines (7 PM ET)
    # Run at 11 PM UTC OR manual trigger with mode=capture-odds
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 23 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'capture-odds')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Capture closing lines
        env:
          ODDS_API_KEY:  ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/daily_nrfi.py --capture-odds $DATE_ARG

      - name: Commit closing lines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nrfi_predictions/
          if git diff --staged --quiet; then
            echo "No closing lines to commit."
          else
            git commit -m "nrfi: closing lines $(date -u +%Y-%m-%d) [skip ci]"
            git push origin main
          fi

  resolve:
    name: Night Resolve (1 AM ET)
    # Run at 5 AM UTC OR manual trigger with mode=resolve
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'resolve')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Resolve last night's games
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY }}
          OPENWEATHER_API_KEY:  ${{ secrets.OPENWEATHER_API_KEY || vars.OPENWEATHER_API_KEY }}
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY || vars.ODDS_API_KEY }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/daily_nrfi.py --resolve $DATE_ARG

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nrfi_predictions/ data/nrfi_reports/
          if git diff --staged --quiet; then
            echo "No results to commit."
          else
            git commit -m "nrfi: resolve results $(date -u +%Y-%m-%d) [skip ci]"
            git push origin main
          fi
